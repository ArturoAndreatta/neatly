name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    name: Anexar Neatly.zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Montar o zip
        run: git archive HEAD --prefix=Neatly/ instalar.cmd desinstalar.cmd src LICENSE README.md -o Neatly.zip

      - name: Anexar ao release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" Neatly.zip --clobber
