name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    name: Testes e build no Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.5
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Analisar
        run: |
          dart format --output=none --set-exit-if-changed packages app/lib
          flutter analyze

      - name: Testes do motor
        working-directory: packages/neatly_core
        run: dart test

      - name: Build do app
        working-directory: app
        run: flutter build windows --release

      - name: Instalador
        shell: pwsh
        run: |
          $versao = (Select-String -Path app/pubspec.yaml -Pattern '^version:\s*([\d.]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersao=$versao" installer\neatly.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: NeatlySetup
          path: installer/saida/NeatlySetup.exe
